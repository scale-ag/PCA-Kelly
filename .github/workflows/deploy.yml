name: Build & Deploy Dashboard

# Dispara de 3 formas:
#  - workflow_dispatch : chamado pelo cron-job.org a cada 30 min (via API do GitHub)
#  - schedule          : backup nativo (o agendador do GitHub costuma atrasar; o
#                        cron-job.org e a fonte principal de pontualidade)
#  - push              : reconstroi quando o codigo muda
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [ main ]
    paths:
      - "build/**"
      - ".github/workflows/deploy.yml"

# Somente leitura do repo + permissao para publicar no Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Nunca roda dois deploys ao mesmo tempo; nao cancela um deploy em andamento
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dashboard (le as planilhas via CSV publico, somente leitura)
        run: python build/build.py --out dist/index.html

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Configure Pages (habilita automaticamente na 1a execucao)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # O deploy-pages as vezes nao enxerga o artifact recem-enviado ("No artifacts
      # named github-pages") ou estoura o timeout do token OIDC — instabilidade do
      # GitHub. Em vez de perder a rodada, espera e tenta de novo (ate 3x).
      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Aguardar antes de tentar de novo
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (2a tentativa)
        id: deploy2
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Aguardar antes da ultima tentativa
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (3a tentativa)
        id: deploy3
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
